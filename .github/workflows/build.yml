# GitHub Actions: push / PR / 手動起動で 3 OS 分の 3D ビュアープラグインを
# ビルドし、成果物 (ModelViewerPlugin.{dylib,so,dll}) を Artifacts に上げる。
# 動作確認用の CI (Release はしない)。正式配布は release.yml (v* タグ) が担当する。
#
#   ★macOS の成果物は Developer ID で「署名のみ」する (公証はしない)。
#     farman.app は Hardened Runtime 付きで署名されておりライブラリ検証が働く
#     ため、同じ Team ID で署名された dylib しかロードできない (ad-hoc 署名だと
#     "library load disallowed by system policy" で弾かれる)。署名だけあれば
#     手元の farman で動作確認できる。公証が無いので、ブラウザ経由でダウンロード
#     して quarantine が付いた場合は xattr -d com.apple.quarantine が必要
#     (gh run download 経由なら quarantine は付かない)。
#
#   ★ABI 一致が必須: プラグインは farman 本体と同じ Qt でビルドしないと、
#     farman プロセスにロードされたとき qobject_cast や動的リンク解決に失敗する。
#     QT_VERSION は farman 本体の release.yml と必ず揃えること (現在 6.10.3)。
#
#   ★依存の扱い:
#     - assimp: farman 本体は使わない依存なので、プラグインに「静的リンク」して
#       自己完結させる (配布物は単一ファイル)。CI で assimp を静的ビルドする。
#     - Qt6OpenGL: farman 本体が同梱する (本体 CMakeLists に Qt6::OpenGL を追加済)。
#       プラグインは farman プロセスに既ロードの Qt を再利用する。

name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  # farman 本体 (.github/workflows/release.yml の QT_VERSION) と揃えること。
  QT_VERSION: 6.10.3
  # assimp は farman 本体の Homebrew 版に合わせる (upstream タグ)。
  ASSIMP_VERSION: v6.0.4
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest
            qt_host: mac
            qt_arch: clang_64
            artifact_name: macos
          - name: Linux (x86_64)
            os: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            artifact_name: linux
          - name: Windows (x64)
            os: windows-latest
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact_name: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # QtOpenGL は qtbase に含まれるため追加モジュールは不要。

      # Linux はプラグインのビルドに OpenGL の開発ヘッダが要る。
      - name: Install OpenGL / zlib headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev zlib1g-dev

      # ──────── assimp を静的ビルド (キャッシュ) ────────
      - name: Cache assimp (static)
        id: cache-assimp
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/assimp-install
          key: assimp-${{ env.ASSIMP_VERSION }}-${{ runner.os }}-static-v2

      - name: Build assimp (static, Unix)
        if: runner.os != 'Windows' && steps.cache-assimp.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # zlib の扱い:
          #  - Linux: システムの static libz.a は非 PIC で、共有モジュール (.so)
          #    にリンクできない (relocation R_X86_64_PC32 ... recompile with -fPIC)。
          #    そのため PIC でビルドした同梱 zlib を使う。
          #  - macOS: 同梱 zlib が新しい SDK でビルドできない (contrib/zlib が
          #    _stdio.h と衝突) ため、システム zlib (libz.tbd, 共有スタブ) を使う。
          ZLIB_ARGS=()
          if [ "$RUNNER_OS" = "Linux" ]; then ZLIB_ARGS+=(-DASSIMP_BUILD_ZLIB=ON); fi
          git clone --depth 1 --branch "${ASSIMP_VERSION}" \
            https://github.com/assimp/assimp.git "$RUNNER_TEMP/assimp-src"
          cmake -S "$RUNNER_TEMP/assimp-src" -B "$RUNNER_TEMP/assimp-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DASSIMP_BUILD_TESTS=OFF \
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF \
            -DASSIMP_BUILD_SAMPLES=OFF \
            -DASSIMP_INSTALL=ON \
            -DASSIMP_NO_EXPORT=ON \
            -DASSIMP_WARNINGS_AS_ERRORS=OFF \
            "${ZLIB_ARGS[@]}" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/assimp-install"
          cmake --build "$RUNNER_TEMP/assimp-build" --config Release --parallel 3
          cmake --install "$RUNNER_TEMP/assimp-build" --config Release

      - name: Build assimp (static, Windows)
        if: runner.os == 'Windows' && steps.cache-assimp.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:ASSIMP_VERSION" `
            https://github.com/assimp/assimp.git "$env:RUNNER_TEMP/assimp-src"
          cmake -S "$env:RUNNER_TEMP/assimp-src" -B "$env:RUNNER_TEMP/assimp-build" `
            -DBUILD_SHARED_LIBS=OFF `
            -DASSIMP_BUILD_TESTS=OFF `
            -DASSIMP_BUILD_ASSIMP_TOOLS=OFF `
            -DASSIMP_BUILD_SAMPLES=OFF `
            -DASSIMP_INSTALL=ON `
            -DASSIMP_NO_EXPORT=ON `
            -DASSIMP_WARNINGS_AS_ERRORS=OFF `
            -DASSIMP_BUILD_ZLIB=ON `
            -DCMAKE_INSTALL_PREFIX="$env:RUNNER_TEMP/assimp-install"
          cmake --build "$env:RUNNER_TEMP/assimp-build" --config Release --parallel 3
          cmake --install "$env:RUNNER_TEMP/assimp-build" --config Release

      # ──────── Configure / Build (プラグイン) ────────
      # assimp は静的ライブラリを CMAKE_PREFIX_PATH に足して find_package させる。
      # Qt は install-qt-action が CMAKE_PREFIX_PATH env に登録済み。
      - name: Configure & build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -Dassimp_ROOT="$RUNNER_TEMP/assimp-install"
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 3

      - name: Configure & build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -Dassimp_ROOT="$env:RUNNER_TEMP/assimp-install"
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 3

      # ──────── 成果物の収集 ────────
      - name: Collect artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p out
          f=$(find build -type f \( -name 'ModelViewerPlugin.dylib' -o -name 'ModelViewerPlugin.so' \) | head -1)
          echo "built: $f"
          cp "$f" "out/$(basename "$f")"

          # macOS: プラグインの Qt framework 参照を farman.app がバンドルする
          # 位置 @executable_path/../Frameworks/ に書き換える (assimp は静的なので不要)。
          if [ "${{ runner.os }}" = "macOS" ]; then
            dylib="out/ModelViewerPlugin.dylib"
            fw="@executable_path/../Frameworks"
            for dep in $(otool -L "$dylib" | awk 'NR>1{print $1}'); do
              case "$dep" in
                *Qt*.framework/*)
                  name=$(echo "$dep" | sed -E 's#.*/([A-Za-z0-9]+)\.framework/.*#\1#')
                  install_name_tool -change "$dep" \
                    "$fw/${name}.framework/Versions/A/${name}" "$dylib" ;;
              esac
            done
            echo "=== otool -L (rewritten) ==="
            otool -L "$dylib" || true
          fi

      # Developer ID 署名 (macOS、公証なし)。install_name 書き換えで署名が無効化
      # されるため、書き換えの「後」に署名する。release.yml の署名手順と同じだが
      # notarytool への提出は省く (push ごとに公証を回さない)。MACOS_CERTIFICATE_*
      # secrets が無い場合 (fork からの PR 等) は ad-hoc のまま warning を出して続行。
      - name: Sign with Developer ID (macOS, no notarization)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT_BASE64:   ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          dylib="out/ModelViewerPlugin.dylib"
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::Developer ID signing NOT available (MACOS_CERTIFICATE_* secrets 未設定)。"
            echo "ad-hoc 署名のままです。Hardened Runtime の farman.app にはロードできません。"
            exit 0
          fi

          # 一時 Keychain に .p12 を import (release.yml と同手順)。
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          IDENTITY_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -n 1 | awk '{print $2}')
          if [ -z "$IDENTITY_HASH" ]; then
            echo "::error::Developer ID Application identity not found after import"; exit 1
          fi

          codesign --force --options runtime --timestamp \
            --sign "$IDENTITY_HASH" "$dylib"
          codesign --verify --strict "$dylib"
          echo "signed: $(codesign -dvv "$dylib" 2>&1 | grep -i authority | head -1)"

      - name: Collect artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $f = Get-ChildItem -Path build -Recurse -Filter ModelViewerPlugin.dll | Select-Object -First 1
          Write-Host "built: $($f.FullName)"
          Copy-Item $f.FullName "out/ModelViewerPlugin.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out
          retention-days: 7
